<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Église Nouvelle Alliance</title>
  <style>
    :root{
      --primary-500:#0ea5e9;--primary-600:#0284c7;--primary-700:#0369a1;
      --dark-bg:#0b0f19;--dark-surface:#151e32;--dark-card:#1e293b;--dark-border:#334155;
      --text-main:#f8fafc;--text-muted:#94a3b8;
      --radius-sm:6px;--radius-md:12px;--shadow-soft:0 10px 25px -5px rgba(0,0,0,0.5);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background-color:var(--dark-bg);color:var(--text-main);line-height:1.6;padding:20px 10px}
    .app-container{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:25px}
    
    .auth-bar{display:flex;justify-content:flex-end}
    .btn-auth{background:var(--primary-700);color:white;border:none;padding:10px 18px;border-radius:var(--radius-sm);font-weight:700;cursor:pointer}
    .btn-auth.logout{background:#e11d48}

    .header-card{background:var(--dark-surface);border:1px solid var(--dark-border);border-radius:var(--radius-md);padding:25px;text-align:center}
    .header-card h1{color:var(--primary-500);font-size:2rem;margin-bottom:8px}

    .admin-only{display:none;background:var(--dark-surface);border:2px dashed var(--primary-500);border-radius:var(--radius-md);padding:20px;margin-bottom:20px}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:0.85rem;color:var(--text-muted);margin-bottom:4px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--dark-border);background:var(--dark-bg);color:white}
    .btn-publish{width:100%;padding:12px;background:var(--primary-600);color:white;border:none;border-radius:var(--radius-sm);font-weight:700;cursor:pointer}

    /* Table Planning */
    .table-container{background:var(--dark-card);border-radius:var(--radius-md);border:1px solid var(--dark-border);overflow:hidden;box-shadow:var(--shadow-soft)}
    .table-title{padding:15px 20px;background:var(--dark-surface);border-bottom:1px solid var(--dark-border);font-size:1.1rem;color:var(--primary-500)}
    table{width:100%;border-collapse:collapse;text-align:left}
    th,td{padding:14px 18px;border-bottom:1px solid var(--dark-border)}
    th{background:var(--primary-700);color:white;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px}
    tr:last-child td{border-bottom:none}tr:nth-child(even){background-color:rgba(255,255,255,.02)}
  </style>
</head>
<body>

  <div class="app-container">
    <div class="auth-bar">
      <button id="authBtn" class="btn-auth">🔒 Accès Administrateur</button>
    </div>

    <header class="header-card">
      <h1 id="siteTitle">Église Nouvelle Alliance</h1>
      <p id="siteBio">Une nouvelle alliance, une nouvelle vie en Christ.</p>
    </header>

    <!-- Zone d'administration (Modifiée sans la case Type) -->
    <div id="adminPanel" class="admin-only">
      <h2>📅 Modification du Planning des Cultes</h2>
      <form id="scheduleForm">
        <div class="form-group">
          <label for="selectDay">Sélectionner le jour :</label>
          <select id="selectDay">
            <option value="0">Lundi</option>
            <option value="1">Mardi</option>
            <option value="2">Mercredi</option>
            <option value="3">Jeudi</option>
            <option value="4">Vendredi</option>
            <option value="5">Samedi</option>
            <option value="6">Dimanche</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inputActivity">Nom de l'activité :</label>
          <input type="text" id="inputActivity" placeholder="Ex: Culte de Semaine">
        </div>
        <div class="form-group">
          <label for="inputHour">Horaire :</label>
          <input type="text" id="inputHour" placeholder="Ex: 16h00 - 18h00">
        </div>
        <button type="submit" class="btn-publish">Mettre à jour ce jour</button>
      </form>
    </div>

    <!-- Planning des Cultes (Tableau simplifié sans la colonne Type) -->
    <section class="table-container">
      <div class="table-title"><strong>Planning des Activités & Cultes</strong></div>
      <table>
        <thead>
          <tr>
            <th>Jour</th>
            <th>Activité</th>
            <th>Heure</th>
          </tr>
        </thead>
        <tbody id="scheduleBody">
          <!-- Données chargées dynamiquement -->
        </tbody>
      </table>
    </section>
  </div>

  <script>
    (function(){
      const ADMIN_PASSWORD = "1234"; 
      const authBtn = document.getElementById('authBtn');
      const adminPanel = document.getElementById('adminPanel');
      const scheduleForm = document.getElementById('scheduleForm');
      const scheduleBody = document.getElementById('scheduleBody');

      let isLoggedIn = false;

      // Structure des données simplifiée (sans la propriété 'type')
      let defaultSchedule = [
        { day: "Lundi", activity: "Intercession", hour: "À préciser" },
        { day: "Mardi", activity: "Répétition", hour: "À préciser" },
        { day: "Mercredi", activity: "Culte de Semaine", hour: "16h00 - 18h00" },
        { day: "Jeudi", activity: "Répétition", hour: "À préciser" },
        { day: "Vendredi", activity: "Culte d'Enseignement / Prière", hour: "16h00 - 18h00" },
        { day: "Samedi", activity: "Répétition Générale", hour: "À partir de 15h00" },
        { day: "Dimanche", activity: "Grand Culte Dominical", hour: "08h00 - 12h00" }
      ];

      renderSchedule();

      authBtn.addEventListener('click', function(){
        if(!isLoggedIn){
          const pass = prompt("Saisissez le mot de passe Administrateur :");
          if(pass === ADMIN_PASSWORD){
            isLoggedIn = true;
            adminPanel.style.display = 'block';
            authBtn.textContent = "🔓 Déconnexion Admin";
            authBtn.classList.add('logout');
          } else if(pass !== null){
            alert("Mot de passe incorrect.");
          }
        } else {
          isLoggedIn = false;
          adminPanel.style.display = 'none';
          authBtn.textContent = "🔒 Accès Administrateur";
          authBtn.classList.remove('logout');
        }
      });

      scheduleForm.addEventListener('submit', function(e){
        e.preventDefault();

        const dayIdx = parseInt(document.getElementById('selectDay').value, 10);
        const activity = document.getElementById('inputActivity').value.trim();
        const hour = document.getElementById('inputHour').value.trim();

        if(!activity || !hour){
          alert("Veuillez remplir l'activité et l'horaire.");
          return;
        }

        let currentSchedule = getScheduleData();
        currentSchedule[dayIdx].activity = activity;
        currentSchedule[dayIdx].hour = hour;

        localStorage.setItem('siteSchedule', JSON.stringify(currentSchedule));
        renderSchedule();
        alert("Planning mis à jour pour " + currentSchedule[dayIdx].day + " !");
      });

      function getScheduleData(){
        const saved = localStorage.getItem('siteSchedule');
        return saved ? JSON.parse(saved) : defaultSchedule;
      }

      function renderSchedule(){
        const data = getScheduleData();
        scheduleBody.innerHTML = '';
        data.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${item.day}</strong></td>
            <td>${item.activity}</td>
            <td>${item.hour}</td>
          `;
          scheduleBody.appendChild(tr);
        });
      }
    })();
  </script>
</body>
</html>
