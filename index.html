<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Église Nouvelle Alliance</title>
  <style>
    :root{
      --primary-500:#0ea5e9;--primary-600:#0284c7;--primary-700:#0369a1;
      --dark-bg:#0b0f19;--dark-surface:#151e32;--dark-card:#1e293b;--dark-border:#334155;
      --text-main:#f8fafc;--text-muted:#94a3b8;
      --radius-sm:6px;--radius-md:12px;--shadow-soft:0 10px 25px -5px rgba(0,0,0,0.5);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background-color:var(--dark-bg);color:var(--text-main);line-height:1.6;padding:20px 10px}
    .app-container{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:25px}
    
    .auth-bar{display:flex;justify-content:flex-end}
    .btn-auth{background:var(--primary-700);color:white;border:none;padding:10px 18px;border-radius:var(--radius-sm);font-weight:700;cursor:pointer}
    .btn-auth.logout{background:#e11d48}

    .header-card{background:var(--dark-surface);border:1px solid var(--dark-border);border-radius:var(--radius-md);padding:25px;text-align:center}
    .header-card h1{color:var(--primary-500);font-size:2rem;margin-bottom:8px}

    .temoignage-card{background:var(--dark-card);border:1px solid var(--dark-border);border-radius:var(--radius-md);padding:20px}
    .compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin-top:15px}
    .compare-box img{width:100%;height:300px;object-fit:cover;border-radius:8px}

    .admin-only{display:none;background:var(--dark-surface);border:2px dashed var(--primary-500);border-radius:var(--radius-md);padding:20px;margin-bottom:20px}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:0.85rem;color:var(--text-muted);margin-bottom:4px}
    .form-group input,.form-group textarea{width:100%;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--dark-border);background:var(--dark-bg);color:white}
    .btn-publish{width:100%;padding:12px;background:var(--primary-600);color:white;border:none;border-radius:var(--radius-sm);font-weight:700;cursor:pointer}

    .tiktok-scroll-wrapper{width:100%;max-width:380px;height:550px;margin:0 auto;overflow-y:scroll;scroll-snap-type:y mandatory;border-radius:var(--radius-md);border:2px solid var(--primary-500);background:#000}
    .tiktok-slide{width:100%;height:100%;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
    .tiktok-slide img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    .tiktok-overlay{position:relative;z-index:2;background:linear-gradient(transparent,rgba(0,0,0,0.9));padding:20px}

    /* small status indicator */
    .save-status{font-size:0.85rem;color:var(--text-muted);margin-top:8px}
    .saving{color:#f59e0b}
    .saved{color:#10b981}
  </style>
</head>
<body>

  <div class="app-container">
    <div class="auth-bar">
      <button id="authBtn" class="btn-auth">🔒 Accès Administrateur</button>
    </div>

    <!-- Titre mis à jour en direct -->
    <header class="header-card">
      <h1 id="siteTitle">Chargement...</h1>
      <p id="siteBio">Chargement...</p>
    </header>

    <!-- Zone d'administration -->
    <div id="adminPanel" class="admin-only">
      <h2>⚙️ Panneau Administrateur (Modifications en direct)</h2>
      <div class="form-group">
        <label>Titre de l'Église :</label>
        <input type="text" id="inputSiteTitle" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Description / Verset :</label>
        <textarea id="inputSiteBio" rows="3"></textarea>
      </div>
      <button id="saveConfigBtn" class="btn-publish">Enregistrer pour TOUS les visiteurs</button>
      <div id="saveStatus" class="save-status"></div>
    </div>

    <!-- Photos Témoignage -->
    <section class="temoignage-card">
      <h2 style="color: var(--primary-500); text-align:center;">✨ Témoignage de Guérison (Cameroun)</h2>
      <div class="compare-grid">
        <div class="compare-box">
          <p style="text-align:center; font-weight:bold; margin-bottom:5px;">AVANT</p>
          <img src="avant.jpg" alt="Avant" onerror="this.src='https://picsum.photos/400/500?random=1'">
        </div>
        <div class="compare-box">
          <p style="text-align:center; font-weight:bold; color:#10b981; margin-bottom:5px;">APRÈS</p>
          <img src="apres.jpg" alt="Après" onerror="this.src='https://picsum.photos/400/500?random=2'">
        </div>
      </div>
    </section>

    <!-- Fil d'actualité mis à jour en direct -->
    <div class="tiktok-scroll-wrapper" id="tiktokFeed">
      <!-- Les annonces s'affichent ici en temps réel -->
    </div>
  </div>

  <!-- Ingestion des scripts Firebase Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    // 1. CONFIGURATION DE VOTRE BASE DE DONNÉES FIREBASE
    // (Remplacez ces infos avec vos identifiants Firebase créés sur console.firebase.google.com)
    const firebaseConfig = {
      apiKey: "VOTRE_API_KEY",
      authDomain: "votre-projet.firebaseapp.com",
      databaseURL: "https://votre-projet-default-rtdb.firebaseio.com",
      projectId: "votre-projet",
      storageBucket: "votre-projet.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    // Initialisation
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Elements du DOM
    const authBtn = document.getElementById('authBtn');
    const adminPanel = document.getElementById('adminPanel');
    const siteTitle = document.getElementById('siteTitle');
    const siteBio = document.getElementById('siteBio');
    const inputSiteTitle = document.getElementById('inputSiteTitle');
    const inputSiteBio = document.getElementById('inputSiteBio');
    const saveConfigBtn = document.getElementById('saveConfigBtn');
    const saveStatus = document.getElementById('saveStatus');

    let isAdmin = false;

    // Debounce utilitaire
    function debounce(fn, wait){
      let t;
      return function(...args){
        clearTimeout(t);
        t = setTimeout(()=> fn.apply(this, args), wait);
      };
    }

    // Affiche le statut de sauvegarde
    function showStatus(text, cls){
      saveStatus.textContent = text;
      saveStatus.className = 'save-status ' + (cls || '');
      if(cls === 'saved'){
        setTimeout(()=> {
          // effacer le message après 2s
          if(saveStatus.className.includes('saved')) saveStatus.textContent = '';
        }, 2000);
      }
    }

    // 2. ÉCOUTE EN TEMPS RÉEL (Pour TOUS les visiteurs)
    // Dès que vous modifiez dans Firebase, TOUS les téléphones se mettent à jour INSTANTANÉMENT
    db.ref('siteConfig').on('value', (snapshot) => {
      const data = snapshot.val();
      if(data) {
        siteTitle.textContent = data.title || "Église Nouvelle Alliance";
        siteBio.textContent = data.bio || "Bienvenue !";

        // Ne pas écraser le champ si l'admin est en train de taper (focus)
        if(!inputSiteTitle.matches(':focus')) inputSiteTitle.value = data.title || '';
        if(!inputSiteBio.matches(':focus')) inputSiteBio.value = data.bio || '';
      }
    });

    // 3. CODE ADMINISTRATEUR (simple mot de passe pour la démo)
    authBtn.addEventListener('click', () => {
      if(!isAdmin) {
        const pass = prompt("Mot de passe Administrateur :");
        if(pass === "1234") {
          isAdmin = true;
          adminPanel.style.display = 'block';
          authBtn.textContent = "🔓 Déconnexion";
          authBtn.classList.add('logout');
          // charger valeurs actuelles
          db.ref('siteConfig').once('value').then(snap => {
            const data = snap.val() || {};
            inputSiteTitle.value = data.title || siteTitle.textContent;
            inputSiteBio.value = data.bio || siteBio.textContent;
          });
        } else if(pass !== null) {
          alert("Mot de passe incorrect.");
        }
      } else {
        isAdmin = false;
        adminPanel.style.display = 'none';
        authBtn.textContent = "🔒 Accès Administrateur";
        authBtn.classList.remove('logout');
      }
    });

    // 4. ENREGISTREMENT ET ENVOI À TOUT LE MONDE (auto-save avec debounce)
    function saveConfigImmediate() {
      if(!isAdmin) return;
      const title = inputSiteTitle.value;
      const bio = inputSiteBio.value;
      showStatus('Enregistrement...', 'saving');
      // .update pour ne pas écraser d'autres données si ajoutées plus tard
      return db.ref('siteConfig').update({ title, bio })
        .then(() => {
          showStatus('Enregistré', 'saved');
        })
        .catch((err) => {
          console.error('Erreur sauvegarde:', err);
          showStatus('Erreur de sauvegarde', '');
        });
    }

    const saveConfigDebounced = debounce(saveConfigImmediate, 800);

    // Sauvegarde automatique à la frappe
    inputSiteTitle.addEventListener('input', () => {
      if(!isAdmin) return;
      saveConfigDebounced();
    });
    inputSiteBio.addEventListener('input', () => {
      if(!isAdmin) return;
      saveConfigDebounced();
    });

    // Bouton de sauvegarde manuelle (immédiate)
    saveConfigBtn.addEventListener('click', () => {
      if(!isAdmin) {
        alert('Vous devez être administrateur pour enregistrer.');
        return;
      }
      saveConfigImmediate();
    });

    // Sauvegarde immédiate si admin ferme la page pendant l'édition
    window.addEventListener('beforeunload', (e) => {
      if(isAdmin && (inputSiteTitle.value || inputSiteBio.value)) {
        // tentera un dernier envoi synchrone (peut ne pas réussir selon le navigateur)
        navigator.sendBeacon && db.ref('siteConfig').update({ title: inputSiteTitle.value, bio: inputSiteBio.value });
      }
    });

    // Note: Pour les autres contenus dynamiques (ex: fil d'actualité), écoutez d'autres nœuds Firebase
    // ex : db.ref('announcements').on('child_added', snapshot => { ...render... })
  </script>
</body>
</html>
